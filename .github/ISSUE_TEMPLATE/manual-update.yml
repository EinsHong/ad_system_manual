name: 매뉴얼 수정 요청
description: 기능 변경 사항을 매뉴얼에 반영해 달라고 요청합니다 (Claude가 PR을 올립니다)
title: "[매뉴얼] "
labels: ["매뉴얼 수정"]
body:
  - type: dropdown
    id: menu
    attributes:
      label: 해당 메뉴
      options:
        - 사용자 설정
        - 부정클릭 모니터링
        - 경쟁사 모니터링
        - 통합 리포트 시스템
        - 광고 대량 등록
        - 광고 운영 시스템
        - 잘 모르겠음
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 변경 내용
      description: 무엇이 어떻게 바뀌었는지 적어주세요. 버튼·탭 이름은 화면에 보이는 그대로 적어주세요.
      placeholder: 예) 리포트 화면의 [엑셀 다운로드] 버튼이 하단에서 상단 툴바로 이동함
    validations:
      required: true
  - type: dropdown
    id: screenshot
    attributes:
      label: 화면(스크린샷)도 바뀌었나요?
      options:
        - 아니요
        - 예 (새 캡처를 아래에 첨부)
  - type: textarea
    id: images
    attributes:
      label: 새 화면 캡처 (선택)
  - type: checkboxes
    id: run
    attributes:
      label: 에이전트 실행
      options:
        - label: "@claude 위 내용을 매뉴얼에 반영하고 PR을 올려줘"
          required: true
